name: Release
on:
  push:
    tags: ['wingy-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag to validate and publish
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: wingy-release
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: windows-latest
    outputs:
      commit: ${{ steps.freeze.outputs.commit }}
      tag: ${{ steps.freeze.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Freeze the immutable release source
        id: freeze
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_COMMIT: ${{ github.sha }}
        run: |
          git check-ref-format "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE) { throw 'Invalid release tag' }
          $commit = git rev-parse --verify "refs/tags/$env:RELEASE_TAG^{commit}"
          if ($LASTEXITCODE -or $commit -notmatch '^[a-f0-9]{40}$') { throw 'Missing immutable release tag' }
          if ($env:EVENT_NAME -eq 'push' -and $commit -ne $env:EVENT_COMMIT) { throw 'Release tag moved' }
          "commit=$commit" >> $env:GITHUB_OUTPUT
          "tag=$env:RELEASE_TAG" >> $env:GITHUB_OUTPUT
  checks:
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      release_ref: ${{ needs.resolve.outputs.commit }}
  publish:
    needs: [resolve, checks]
    runs-on: windows-latest
    timeout-minutes: 360
    permissions:
      contents: write
      actions: read
    env:
      CARGO_HOME: D:/BuildCache/wingy-release/cargo
      CARGO_TARGET_DIR: D:/BuildCache/wingy-release/target
      RUSTUP_HOME: D:/BuildCache/wingy-release/rustup
      TEMP: D:/BuildCache/wingy-release/tmp
      TMP: D:/BuildCache/wingy-release/tmp
      PYTHONPYCACHEPREFIX: D:/BuildCache/wingy-release/pycache
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.symlinks
      GIT_CONFIG_VALUE_0: 'true'
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve.outputs.commit }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Prepare compiler and storage
        run: |
          New-Item -ItemType Directory -Force $env:CARGO_HOME,$env:CARGO_TARGET_DIR,$env:RUSTUP_HOME,$env:TEMP | Out-Null
          rustup toolchain install 1.98.0 --profile minimal
          if ($LASTEXITCODE) { throw 'Toolchain installation failed' }
          rustup default 1.98.0
      - name: Publish verified packages and GitHub release
        run: |
          $remote = git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG^{}"
          if ($LASTEXITCODE -or $remote -notmatch "^$env:RELEASE_COMMIT\s") { throw 'Remote release tag changed' }
          python scripts/release.py --publish --tag $env:RELEASE_TAG
          if ($LASTEXITCODE) { throw 'Release failed' }
