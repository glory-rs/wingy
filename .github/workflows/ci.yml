name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  windows:
    name: validate-windows
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_HOME: D:/BuildCache/wingy/cargo
      CARGO_TARGET_DIR: D:/BuildCache/wingy/target
      RUSTUP_HOME: D:/BuildCache/wingy/rustup
      TEMP: D:/BuildCache/wingy/tmp
      TMP: D:/BuildCache/wingy/tmp
      PYTHONPYCACHEPREFIX: D:/BuildCache/wingy/pycache
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Prepare compiler and storage
        run: |
          New-Item -ItemType Directory -Force $env:CARGO_HOME,$env:CARGO_TARGET_DIR,$env:RUSTUP_HOME,$env:TEMP | Out-Null
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy
          if ($LASTEXITCODE) { throw 'Toolchain installation failed' }
          rustup default 1.95.0
          python scripts/library_lockfiles.py
          if ($LASTEXITCODE) { throw 'Library dependency resolution failed' }
      - name: Validate source and release plan
        run: |
          python -m unittest discover -s scripts -p test_release.py
          if ($LASTEXITCODE) { throw 'Release tooling tests failed' }
          python scripts/release.py
          if ($LASTEXITCODE) { throw 'Release plan failed' }
          cargo fmt --all -- --check
          if ($LASTEXITCODE) { throw 'Formatting failed' }
      - name: Validate publication archive on release tags
        if: startsWith(github.ref, 'refs/tags/wingy-v')
        run: |
          python scripts/release.py --check-package wingy-core
          if ($LASTEXITCODE) { throw 'Archive contents failed' }
      - name: Tests and compilation
        run: |
          cargo test --locked -p wingy-dpi -p wingy-core -p wingy-common -p wingy-win32 -p wingy
          if ($LASTEXITCODE) { throw 'Validation failed' }
          rustc --edition=2024 --test wingy-android/src/event_loop_lifetime.rs -o D:/BuildCache/wingy/target/activity-tests.exe
          if ($LASTEXITCODE) { throw 'Validation failed' }
          & D:/BuildCache/wingy/target/activity-tests.exe
          if ($LASTEXITCODE) { throw 'Validation failed' }
          rustc --edition=2024 --test wingy-uikit/src/text_input_model.rs -o D:/BuildCache/wingy/target/uikit-tests.exe
          if ($LASTEXITCODE) { throw 'Validation failed' }
          & D:/BuildCache/wingy/target/uikit-tests.exe
          if ($LASTEXITCODE) { throw 'Validation failed' }
          rustc --edition=2024 --test wingy-android/src/text_input_model.rs -o D:/BuildCache/wingy/target/game-ime-tests.exe
          if ($LASTEXITCODE) { throw 'Validation failed' }
          & D:/BuildCache/wingy/target/game-ime-tests.exe
          if ($LASTEXITCODE) { throw 'Validation failed' }
  linux:
    name: validate-linux
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install compiler and platform libraries
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev xvfb
      - name: Check native backends and run common tests
        run: |
          python scripts/library_lockfiles.py
          cargo check --locked -p wingy-x11 -p wingy-wayland -p wingy --all-targets
          xvfb-run -a cargo test --locked -p wingy-dpi -p wingy-core -p wingy-common -p wingy --lib
  apple:
    name: validate-apple
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install compiler and UIKit target
        run: |
          rustup toolchain install 1.98.0 --profile minimal --target aarch64-apple-ios-sim
          rustup default 1.98.0
      - name: Check AppKit and UIKit backends
        run: |
          python scripts/library_lockfiles.py
          cargo check --locked -p wingy-appkit -p wingy --all-targets
          cargo check --locked -p wingy-uikit -p wingy --target aarch64-apple-ios-sim --lib
  android:
    name: validate-android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install compiler and select the runner NDK
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --target aarch64-linux-android
          rustup default 1.98.0
          ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$ndk" ]; then ndk=$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1); fi
          test -x "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang"
          echo "CC_aarch64_linux_android=$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang" >> "$GITHUB_ENV"
          echo "CXX_aarch64_linux_android=$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang++" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang" >> "$GITHUB_ENV"
      - name: Check both Activity integrations independently
        run: |
          python scripts/library_lockfiles.py
          cargo check --locked -p wingy --target aarch64-linux-android --features android-native-activity --lib
          cargo check --locked -p wingy --target aarch64-linux-android --features android-game-activity --lib
  web-redox:
    name: validate-web-redox
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install compiler and targets
        run: |
          rustup toolchain install 1.98.0 --profile minimal --target wasm32-unknown-unknown,x86_64-unknown-redox
          rustup default 1.98.0
      - name: Check Web and Orbital backends
        run: |
          python scripts/library_lockfiles.py
          cargo check --locked -p wingy --target wasm32-unknown-unknown --lib
          cargo check --locked -p wingy-orbital --target x86_64-unknown-redox --lib
