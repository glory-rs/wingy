[workspace]
default-members = ["wingy"]
members = ["dpi", "wingy*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/glory-rs/wingy"
rust-version = "1.95"
version = "0.31.1"

[workspace.dependencies]
# Workspace dependencies.
# `wingy` has no version here to allow using it in dev deps for docs.
wingy = { path = "wingy" }
wingy-android = { version = "=0.31.1", path = "wingy-android" }
wingy-appkit = { version = "=0.31.1", path = "wingy-appkit" }
wingy-common = { version = "=0.31.1", path = "wingy-common" }
wingy-core = { version = "=0.31.1", path = "wingy-core" }
wingy-orbital = { version = "=0.31.1", path = "wingy-orbital" }
wingy-uikit = { version = "=0.31.1", path = "wingy-uikit" }
wingy-wayland = { version = "=0.31.1", path = "wingy-wayland", default-features = false }
wingy-web = { version = "=0.31.1", path = "wingy-web" }
wingy-win32 = { version = "=0.31.1", path = "wingy-win32" }
wingy-x11 = { version = "=0.31.1", path = "wingy-x11" }

# Core dependencies.
bitflags = "2.13.2"
cfg_aliases = "0.2.2"
cursor-icon = "1.2.0"
dpi = { package = "wingy-dpi", version = "=0.1.3", path = "dpi" }
keyboard-types = "0.8.3"
mint = "0.5.9"
rwh_06 = { package = "raw-window-handle", version = "0.6.2", features = ["std"] }
serde = { version = "1.0.229", features = ["serde_derive"] }
smol_str = "0.3.7"
tracing = { version = "0.1.44", default-features = false }

# Dev dependencies.
image = { version = "0.25.10", default-features = false }
softbuffer = { version = "0.4.8", default-features = false, features = [
    "x11",
    "x11-dlopen",
    "wayland",
    "wayland-dlopen",
] }
tracing-subscriber = "0.3.23"

# Android dependencies.
android-activity = "0.6.1"
ndk = { version = "0.9.0", features = ["rwh_06"], default-features = false }

# Apple dependencies.
block2 = "0.6.2"
dispatch2 = { version = "0.3.1", default-features = false, features = ["std", "objc2"] }
objc2 = { version = "0.6.5", features = ["relax-sign-encoding"] }
objc2-app-kit = { version = "0.3.2", default-features = false }
objc2-core-foundation = { version = "0.3.2", default-features = false }
objc2-core-graphics = { version = "0.3.2", default-features = false }
objc2-core-video = { version = "0.3.2", default-features = false }
objc2-foundation = { version = "0.3.2", default-features = false }
objc2-ui-kit = { version = "0.3.2", default-features = false }

# Windows dependencies.
unicode-segmentation = "1.13.3"
windows-sys = "0.61.2"

# Linux dependencies.
bytemuck = { version = "1.25.2", default-features = false }
calloop = "0.14.5"
foldhash = { version = "0.2.0", default-features = false, features = ["std"] }
libc = "0.2.191"
memmap2 = "0.9.12"
percent-encoding = "2.3.2"
rustix = { version = "1.1.6", default-features = false }
x11-dl = "2.21.0"
x11rb = { version = "0.14.0", default-features = false }
xkbcommon-dl = "0.4.2"

# Orbital dependencies.
libredox = "0.2.0"
orbclient = { version = "0.4.6", default-features = false }
redox_event = { package = "redox_event", version = "0.5.0" }

# Web dependencies.
atomic-waker = "1.1.2"
concurrent-queue = { version = "2.5.0", default-features = false }
console_error_panic_hook = "0.1.7"
js-sys = "0.3.107"
pin-project = "1.1.13"
tracing-web = "0.1.3"
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
wasm-bindgen-test = "0.3.80"
web-time = "1.1.0"
web_sys = { package = "web-sys", version = "0.3.107" }
