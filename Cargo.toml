[workspace]
default-members = ["wingy"]
members = ["dpi", "wingy*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/glory-rs/wingy"
rust-version = "1.86"
version = "0.31.0-beta.4"

[workspace.dependencies]
# Workspace dependencies.
# `wingy` has no version here to allow using it in dev deps for docs.
wingy = { path = "wingy" }
wingy-android = { version = "=0.31.0-beta.4", path = "wingy-android" }
wingy-appkit = { version = "=0.31.0-beta.4", path = "wingy-appkit" }
wingy-common = { version = "=0.31.0-beta.4", path = "wingy-common" }
wingy-core = { version = "=0.31.0-beta.4", path = "wingy-core" }
wingy-orbital = { version = "=0.31.0-beta.4", path = "wingy-orbital" }
wingy-uikit = { version = "=0.31.0-beta.4", path = "wingy-uikit" }
wingy-wayland = { version = "=0.31.0-beta.4", path = "wingy-wayland", default-features = false }
wingy-web = { version = "=0.31.0-beta.4", path = "wingy-web" }
wingy-win32 = { version = "=0.31.0-beta.4", path = "wingy-win32" }
wingy-x11 = { version = "=0.31.0-beta.4", path = "wingy-x11" }

# Core dependencies.
bitflags = "2"
cfg_aliases = "0.2.2"
cursor-icon = "1.1.0"
dpi = { package = "wingy-dpi", version = "=0.1.2", path = "dpi" }
keyboard-types = "0.8.0"
mint = "0.5.6"
rwh_06 = { package = "raw-window-handle", version = "0.6", features = ["std"] }
serde = { version = "1", features = ["serde_derive"] }
smol_str = "0.3"
tracing = { version = "0.1.40", default-features = false }

# Dev dependencies.
image = { version = "0.25.0", default-features = false }
softbuffer = { version = "0.4.8", default-features = false, features = [
    "x11",
    "x11-dlopen",
    "wayland",
    "wayland-dlopen",
] }
tracing-subscriber = "0.3.18"

# Android dependencies.
android-activity = "0.6.0"
ndk = { version = "0.9.0", features = ["rwh_06"], default-features = false }

# Apple dependencies.
block2 = "0.6.1"
dispatch2 = { version = "0.3.0", default-features = false, features = ["std", "objc2"] }
objc2 = { version = "0.6.1", features = ["relax-sign-encoding"] }
objc2-app-kit = { version = "0.3.2", default-features = false }
objc2-core-foundation = { version = "0.3.2", default-features = false }
objc2-core-graphics = { version = "0.3.2", default-features = false }
objc2-core-video = { version = "0.3.2", default-features = false }
objc2-foundation = { version = "0.3.2", default-features = false }
objc2-ui-kit = { version = "0.3.2", default-features = false }

# Windows dependencies.
unicode-segmentation = "1.7.1"
windows-sys = "0.61"

# Linux dependencies.
bytemuck = { version = "1.13.1", default-features = false }
calloop = "0.14.3"
foldhash = { version = "0.2.0", default-features = false, features = ["std"] }
libc = "0.2.64"
memmap2 = "0.9.0"
percent-encoding = "2.0"
rustix = { version = "1.0.7", default-features = false }
x11-dl = "2.19.1"
x11rb = { version = "0.14.0", default-features = false }
xkbcommon-dl = "0.4.2"

# Orbital dependencies.
libredox = "0.1.12"
orbclient = { version = "0.4.3", default-features = false }
redox_event = { package = "redox_event", version = "0.4.8" }

# Web dependencies.
atomic-waker = "1"
concurrent-queue = { version = "2", default-features = false }
console_error_panic_hook = "0.1"
js-sys = "0.3.70"
pin-project = "1"
tracing-web = "0.1"
wasm-bindgen = "0.2.93"
wasm-bindgen-futures = "0.4.43"
wasm-bindgen-test = "0.3"
web-time = "1"
web_sys = { package = "web-sys", version = "0.3.70" }
