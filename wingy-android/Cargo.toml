[package]
description = "Wingy's Android backend"
documentation = "https://docs.rs/wingy-android"
edition.workspace = true
license.workspace = true
name = "wingy-android"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
game-activity = ["android-activity/game-activity"]
native-activity = ["android-activity/native-activity"]
serde = ["dep:serde", "bitflags/serde", "smol_str/serde", "dpi/serde", "wingy-core/serde"]

[dependencies]
bitflags.workspace = true
dpi.workspace = true
rwh_06.workspace = true
serde = { workspace = true, optional = true }
smol_str.workspace = true
tracing.workspace = true
wingy-core.workspace = true

# Platform-specific
[target.'cfg(target_os = "android")'.dependencies]
android-activity.workspace = true
ndk.workspace = true

[dev-dependencies]
wingy.workspace = true

[package.metadata.docs.rs]
features = ["serde", "native-activity"]
targets = ["aarch64-linux-android"]
